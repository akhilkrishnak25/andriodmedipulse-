name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Rocket Wheel Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build app bundle and sync Capacitor Android
        working-directory: ./frontend
        run: npm run cap:sync

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x frontend/android/gradlew

      - name: Build Debug APK
        working-directory: ./frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare named APK file
        run: cp frontend/android/app/build/outputs/apk/debug/app-debug.apk RocketWheel-MediPulse.apk

      - name: Upload Rocket Wheel APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RocketWheel-MediPulse-debug-apk
          path: RocketWheel-MediPulse.apk
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Rocket Wheel MediPulse Android APK
          files: RocketWheel-MediPulse.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
